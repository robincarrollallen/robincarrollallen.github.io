name: Deploy to GitHub Pages

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"   # 与 package.json packageManager 对齐

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          NODE_ENV: production
          # 按你项目 build 需要补齐（无 DB 的占位可参考你仓库 migrate 注释）
          ONE_SERVER_URL: https://example.invalid
          # 关键：用仓库名作为子路径，前后都要带 /
          PUBLIC_PATH: /${{ github.event.repository.name }}/
        run: bun run build

      - name: Assemble static site for Pages
        env:
          # 用户站点用空或 /；项目站点用 /repo-name/
          PUBLIC_PATH: /${{ github.event.repository.name }}/
        run: |
          set -e
          mkdir -p site
          # 若构建产物已是带 base 的路径，这里只同步 One 文档推荐的目录即可
          cp -R dist/client/* site/
          # SPA fallback：GitHub Pages 在路径未命中真实文件时返回 404.html，
          # 直接复用 index.html 让前端路由接管未知路径
          cp site/index.html site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
